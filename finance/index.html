<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Track your salary, daily tips and spending. Get a straight monthly report on what to fix.">
<meta name="theme-color" content="#EEF0F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#090C12" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kasa">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!-- page:start -->
<title>Kasa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one phone-width column — the month's bottom line first, then what drove it; a fixed tab bar with a raised add button. */
:root {
  --bg: #EEF0F3;
  --surface: #FFFFFF;
  --surface-2: #F4F6F9;
  --line: #DCE1E9;
  --ink: #0F1520;
  --ink-2: #465063;
  --muted: #687286;
  --brass: #946410;
  --on-brass: #FFFFFF;
  --brass-soft: #F4EAD6;
  --hero: #121A29;
  --hero-line: #26324A;
  --hero-ink: #F2F4F8;
  --hero-muted: #9AA6BC;
  --hero-brass: #E4B65C;
  --hero-neg: #FF8FB1;
  --tips: #B7791F;
  --spend: #C23B6B;
  --need: #A3ACBD;
  --pos: #1D7A52;
  --neg: #B4234F;
  --warn: #9C5C00;
  --pos-soft: #DFF1E8;
  --neg-soft: #F8E1E9;
  --warn-soft: #F7ECD8;
  --info-soft: #E6EAF1;
  --scrim: rgba(10, 13, 20, .45);
  --shadow: 0 1px 2px rgba(15, 21, 32, .06), 0 10px 28px rgba(15, 21, 32, .07);
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 16px;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090C12; --surface: #121824; --surface-2: #192131; --line: #243046;
    --ink: #E9EDF4; --ink-2: #B5BDCC; --muted: #8590A5;
    --brass: #E2B357; --on-brass: #1A1406; --brass-soft: #2C2416;
    --hero: #151E2F; --hero-line: #2A3650; --hero-ink: #F2F4F8; --hero-muted: #93A0B7; --hero-brass: #E8BC63; --hero-neg: #FF8FB1;
    --tips: #BE8A2C; --spend: #D9548A; --need: #4D5A72;
    --pos: #49C38D; --neg: #F0729B; --warn: #F0B44A;
    --pos-soft: #14291F; --neg-soft: #2E1620; --warn-soft: #2D2412; --info-soft: #1B2333;
    --scrim: rgba(0, 0, 0, .6);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .28);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #090C12; --surface: #121824; --surface-2: #192131; --line: #243046;
  --ink: #E9EDF4; --ink-2: #B5BDCC; --muted: #8590A5;
  --brass: #E2B357; --on-brass: #1A1406; --brass-soft: #2C2416;
  --hero: #151E2F; --hero-line: #2A3650; --hero-ink: #F2F4F8; --hero-muted: #93A0B7; --hero-brass: #E8BC63; --hero-neg: #FF8FB1;
  --tips: #BE8A2C; --spend: #D9548A; --need: #4D5A72;
  --pos: #49C38D; --neg: #F0729B; --warn: #F0B44A;
  --pos-soft: #14291F; --neg-soft: #2E1620; --warn-soft: #2D2412; --info-soft: #1B2333;
  --scrim: rgba(0, 0, 0, .6);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .28);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.muted { color: var(--muted); }
.label {
  font-family: var(--f-mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
}

.app {
  max-width: 32rem;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 8px calc(108px + env(safe-area-inset-bottom, 0px));
  display: grid;
  gap: 14px;
}

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 6px 2px; }
.brand { display: flex; align-items: center; gap: 9px; font-family: var(--f-display); font-stretch: 125%; font-weight: 800; font-size: 20px; letter-spacing: -.01em; }
.brand-mark { width: 26px; height: 26px; display: block; }
.month-nav { display: flex; align-items: center; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.month-nav button { border: 0; background: none; border-radius: 999px; height: 34px; }
.month-nav .icon-btn { width: 34px; display: grid; place-items: center; color: var(--ink-2); }
.month-nav .icon-btn:disabled { opacity: .3; cursor: default; }
.month-nav .icon-btn:not(:disabled):hover { background: var(--surface-2); }
.month-label { padding-inline: 6px; font-weight: 600; font-size: 15px; min-width: 8.6em; }
#view { display: grid; gap: 14px; min-width: 0; }

/* demo banner */
.demo { display: grid; gap: 10px; background: var(--brass-soft); border-radius: var(--radius); padding: 14px 16px; }
.demo p { font-size: 14px; color: var(--ink-2); }
.demo strong { color: var(--ink); }

/* install card */
.install { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.install img { width: 44px; height: 44px; border-radius: 11px; display: block; }
.install b { display: block; font-size: 15px; }
.install p { font-size: 13.5px; color: var(--ink-2); }
.install .share { display: inline-block; width: 15px; height: 15px; vertical-align: -2px; color: var(--brass); }
.install-actions { grid-column: 1 / -1; display: flex; gap: 8px; justify-content: flex-end; }

/* hero */
.hero { background: var(--hero); color: var(--hero-ink); border-radius: 22px; padding: 20px 20px 18px; display: grid; gap: 4px; box-shadow: var(--shadow); border: 1px solid var(--hero-line); }
.hero .label { color: var(--hero-muted); }
.hero-num { font-family: var(--f-display); font-stretch: 125%; font-weight: 750; font-size: clamp(2.3rem, 11vw, 3.1rem); line-height: 1.05; letter-spacing: -.02em; color: var(--hero-brass); margin-block: 4px 2px; font-variant-numeric: tabular-nums; }
.hero-num.is-neg { color: var(--hero-neg); }
.hero-sub { color: var(--hero-muted); font-size: 14px; }
.hero-sub b { color: var(--hero-ink); font-weight: 600; }
.hero-bar { height: 6px; border-radius: 99px; background: var(--hero-line); overflow: hidden; margin-top: 12px; display: flex; gap: 2px; }
.hero-bar span { display: block; height: 100%; border-radius: 99px; }
.hero-bar .kept { background: var(--hero-brass); }
.hero-split { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--hero-line); }
.hero-split div { display: grid; gap: 2px; min-width: 0; }
.hero-split .v { font-family: var(--f-display); font-stretch: 112%; font-weight: 650; font-size: 17px; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pace { font-size: 14px; color: var(--hero-ink); margin-top: 6px; }
.pace .bad { color: var(--hero-neg); }

/* cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.card-head h2 { font-family: var(--f-display); font-stretch: 112%; font-weight: 700; font-size: 17px; letter-spacing: -.005em; }
.card-head .aside { font-size: 13px; color: var(--muted); text-align: right; }
.nudge { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface); border: 1px dashed var(--brass); border-radius: var(--radius); padding: 12px 14px; }
.nudge p { font-size: 14px; color: var(--ink-2); min-width: 0; }
.nudge p b { color: var(--ink); }

/* buttons */
.btn { border: 1px solid transparent; border-radius: 12px; padding: 10px 16px; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; }
.btn-primary { background: var(--ink); color: var(--surface); }
.btn-brass { background: var(--brass); color: var(--on-brass); }
.btn-ghost { background: var(--surface-2); color: var(--ink); border-color: var(--line); }
.btn-danger { background: var(--neg-soft); color: var(--neg); }
.btn-text { background: none; border: 0; color: var(--brass); font-weight: 600; padding: 6px 4px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn-block { width: 100%; }
.btn-sm { padding: 7px 12px; font-size: 14px; border-radius: 10px; }

/* straight talk */
.talk { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.talk li { display: grid; grid-template-columns: 4px 1fr; gap: 12px; padding: 10px 12px 10px 0; border-radius: 12px; font-size: 15px; background: var(--info-soft); overflow: hidden; }
.talk li::before { content: ""; border-radius: 0 4px 4px 0; background: var(--muted); }
.talk li.bad { background: var(--neg-soft); } .talk li.bad::before { background: var(--neg); }
.talk li.warn { background: var(--warn-soft); } .talk li.warn::before { background: var(--warn); }
.talk li.good { background: var(--pos-soft); } .talk li.good::before { background: var(--pos); }
.talk .tag { display: block; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 500; margin-bottom: 2px; color: var(--muted); }
.talk li.bad .tag { color: var(--neg); } .talk li.warn .tag { color: var(--warn); } .talk li.good .tag { color: var(--pos); }

/* meters */
.meter { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line); }
.meter span { display: block; height: 100%; border-radius: 99px; background: var(--brass); }
.meter.over span { background: var(--neg); }
.target-row { display: grid; gap: 6px; }
.target-top { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
.target-top .num { color: var(--ink-2); }
.target-top .over { color: var(--neg); font-weight: 600; }

/* daily chart */
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
.chart .axis { fill: var(--muted); font-family: var(--f-mono); font-size: 9.5px; }
.chart .base { stroke: var(--line); stroke-width: 1; }
.chart .today { stroke: var(--brass); stroke-width: 1; stroke-dasharray: 2 3; }
.chart .hit { fill: transparent; cursor: pointer; }
.chart .col.on .bar { filter: brightness(1.12); }
.chart .col.on .hit { fill: var(--ink); fill-opacity: .05; }
.chart-tip { position: absolute; top: 0; transform: translate(-50%, -100%); background: var(--ink); color: var(--surface); border-radius: 10px; padding: 7px 10px; font-size: 12.5px; pointer-events: none; white-space: nowrap; box-shadow: var(--shadow); display: grid; gap: 2px; z-index: 2; }
.chart-tip .d { font-family: var(--f-mono); font-size: 10.5px; opacity: .75; letter-spacing: .04em; }
.chart-tip .r { display: flex; align-items: center; gap: 7px; }
.chart-tip .r i { width: 12px; height: 2px; border-radius: 2px; display: inline-block; }
.chart-tip .r b { font-variant-numeric: tabular-nums; }
.chart-note { font-size: 13px; color: var(--muted); }

/* category bars */
.cats-list { display: grid; gap: 11px; }
.cat-row { display: grid; gap: 5px; }
.cat-top { display: flex; justify-content: space-between; gap: 12px; font-size: 14.5px; }
.cat-top .num { color: var(--ink); font-weight: 600; }
.cat-top .num small { color: var(--muted); font-weight: 400; font-size: 13px; }
.track { height: 8px; border-radius: 0 4px 4px 0; overflow: hidden; }
.track span { display: block; height: 100%; border-radius: 0 4px 4px 0; background: var(--spend); min-width: 3px; }
.track span.need { background: var(--need); }

/* stat grid */
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.stat .v { font-family: var(--f-display); font-stretch: 112%; font-weight: 650; font-size: 18px; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stat .s { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* entries */
.filters { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.filters::-webkit-scrollbar { display: none; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 13px; font-size: 14px; white-space: nowrap; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.day { display: grid; gap: 2px; }
.day-head { display: flex; justify-content: space-between; gap: 12px; padding: 4px 4px 6px; }
.day-head .label { color: var(--ink-2); }
.day-head .sum { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.rows { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.row { width: 100%; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 11px 14px; border: 0; background: none; text-align: left; }
.row + .row { border-top: 1px solid var(--line); }
.row:hover { background: var(--surface-2); }
.row .glyph { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-family: var(--f-mono); font-size: 11px; font-weight: 500; letter-spacing: .02em; }
.glyph.tip { background: var(--brass-soft); color: var(--brass); }
.glyph.sal, .glyph.inc { background: var(--pos-soft); color: var(--pos); }
.glyph.exp { background: var(--surface-2); color: var(--ink-2); }
.row .what { min-width: 0; }
.row .what b { display: block; font-weight: 600; font-size: 15px; }
.row .what span { display: block; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .amt { font-weight: 600; font-variant-numeric: tabular-nums; }
.row .amt.in { color: var(--pos); }

/* coach */
.coach-intro { display: grid; gap: 14px; }
.coach-intro h2 { font-family: var(--f-display); font-stretch: 118%; font-weight: 750; font-size: 22px; line-height: 1.15; }
.coach-intro p { color: var(--ink-2); font-size: 15px; }
.ai-line { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.ai-line i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.ai-line.on i { background: var(--pos); }
.working { display: grid; gap: 12px; justify-items: start; }
.working .pulse { height: 4px; width: 100%; border-radius: 99px; background: var(--surface-2); overflow: hidden; position: relative; }
.working .pulse::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 35%; border-radius: 99px; background: var(--brass); animation: slide 1.4s ease-in-out infinite; }
@keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(290%); } }
.error { background: var(--neg-soft); color: var(--neg); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.report { display: grid; gap: 16px; }
.report-head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: start; }
.grade { width: 56px; height: 64px; border-radius: 14px; display: grid; place-items: center; font-family: var(--f-display); font-stretch: 125%; font-weight: 800; font-size: 32px; background: var(--info-soft); color: var(--ink); }
.grade.g-A, .grade.g-B { background: var(--pos-soft); color: var(--pos); }
.grade.g-C { background: var(--warn-soft); color: var(--warn); }
.grade.g-D, .grade.g-F { background: var(--neg-soft); color: var(--neg); }
.verdict { font-family: var(--f-display); font-stretch: 106%; font-weight: 600; font-size: 18px; line-height: 1.3; margin-top: 4px; }
.report h3 { font-family: var(--f-mono); font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.report section { display: grid; gap: 8px; }
.leaks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; counter-reset: leak; }
.leaks li { counter-increment: leak; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 4px 10px; }
.leaks li::before { content: counter(leak); grid-row: span 2; width: 22px; height: 22px; border-radius: 50%; background: var(--neg-soft); color: var(--neg); font-family: var(--f-mono); font-size: 11px; display: grid; place-items: center; margin-top: 1px; }
.leak-top { display: flex; justify-content: space-between; gap: 10px; font-weight: 600; }
.leak-top .num { color: var(--neg); }
.leaks p, .wins li { color: var(--ink-2); font-size: 14.5px; }
.actions { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.actions li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 11px 12px; font-size: 15px; align-items: start; }
.actions li + li { border-top: 1px solid var(--line); }
.actions .saves { font-size: 12.5px; font-weight: 600; color: var(--pos); background: var(--pos-soft); border-radius: 99px; padding: 3px 9px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.goals { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.budgets { display: grid; gap: 6px; font-size: 14.5px; }
.budgets div { display: flex; justify-content: space-between; gap: 12px; padding-bottom: 6px; border-bottom: 1px dashed var(--line); }
.wins { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.report-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
.history { display: flex; flex-wrap: wrap; gap: 6px; }

/* settings */
.field { display: grid; gap: 6px; }
.field > span { font-size: 14px; font-weight: 600; }
.field small { font-size: 13px; color: var(--muted); }
.input { width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 11px 12px; font-size: 16px; min-width: 0; }
.input:focus { outline: 2px solid var(--brass); outline-offset: 0; border-color: transparent; }
.input-row { display: flex; gap: 8px; }
.prefixed { position: relative; }
.prefixed .input { padding-left: 3.1em; }
.prefixed em { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-style: normal; color: var(--muted); font-size: 15px; pointer-events: none; }
.settings-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.fine { font-size: 13px; color: var(--muted); }
.fine a { color: var(--brass); }
.confirm { display: grid; gap: 10px; background: var(--neg-soft); border-radius: 12px; padding: 12px; }
.confirm p { font-size: 14px; color: var(--ink); }

/* tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar-in { max-width: 32rem; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: end; padding-inline: 6px; }
.tab { border: 0; background: none; display: grid; justify-items: center; gap: 3px; padding: 9px 0 10px; font-size: 11px; font-weight: 600; color: var(--muted); }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--ink); }
.tab-add { display: grid; justify-items: center; }

/* sheet */
.sheet-wrap { position: fixed; inset: 0; z-index: 20; display: grid; align-items: end; justify-items: center; }
.scrim { position: absolute; inset: 0; background: var(--scrim); animation: fade .18s ease-out; }
.sheet { position: relative; width: 100%; max-width: 32rem; max-height: 92%; overflow-y: auto; overscroll-behavior: contain; background: var(--surface); border-radius: 22px 22px 0 0; padding: 8px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; animation: rise .22s cubic-bezier(.2, .8, .2, 1); }
@media (min-width: 560px) { .sheet-wrap { align-items: center; } .sheet { border-radius: 22px; padding-bottom: 18px; } }
@keyframes rise { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.amount { display: flex; align-items: baseline; justify-content: center; gap: 6px; padding-block: 6px 0; }
.amount em { font-style: normal; font-family: var(--f-display); font-stretch: 112%; font-size: 26px; color: var(--muted); }
.amount input { width: 7.2ch; max-width: 70%; border: 0; background: none; text-align: center; font-family: var(--f-display); font-stretch: 125%; font-weight: 750; font-size: 44px; letter-spacing: -.02em; padding: 0; font-variant-numeric: tabular-nums; }
.amount input:focus { outline: none; }
.amount-hint { text-align: center; font-size: 13px; color: var(--muted); min-height: 1.2em; }
.amount-hint.bad { color: var(--neg); }

.date-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.date-row input { flex: 1 1 9rem; }

/* toast */
.toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30; background: var(--ink); color: var(--surface); border-radius: 12px; padding: 10px 10px 10px 14px; font-size: 14px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow); max-width: calc(100% - 32px); animation: rise .2s ease-out; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
}
</style>
